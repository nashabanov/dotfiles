name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          mise_toml: |
            [tools]
            python = "3.13"
            shellcheck = "latest"
            ruff = "latest"
            stylua = "latest"
            "github:Kampfkarren/selene" = "latest"
            ripgrep = "latest"
            fzf = "latest"

      - name: Ensure Selene is executable
        run: |
          # Selene release ZIPs can lose executable permissions (Kampfkarren/selene#653).
          selene_dir="$(mise where github:Kampfkarren/selene)"
          chmod u+x "$selene_dir/selene"
          mise exec -- selene --version

      - name: Install Neovim and test plugin
        run: |
          export GO_CONTEXT_PATH="$RUNNER_TEMP/go-context.nvim"
          echo "GO_CONTEXT_PATH=$GO_CONTEXT_PATH" >> "$GITHUB_ENV"
          brew install neovim
          revision=$(python -c 'import json; print(json.load(open("nvim/lazy-lock.json"))["go-context.nvim"]["commit"])')
          git init "$GO_CONTEXT_PATH"
          git -C "$GO_CONTEXT_PATH" remote add origin https://github.com/nashabanov/go-context.nvim.git
          git -C "$GO_CONTEXT_PATH" fetch --depth=1 origin "$revision"
          git -C "$GO_CONTEXT_PATH" checkout --detach FETCH_HEAD

      - name: Lint and tests
        run: make lint test
