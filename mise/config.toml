[settings]
idiomatic_version_file_enable_tools = ["ruby"]

[tools]
# Default runtimes; projects can override these versions.
go = "1.26"                                        # doctor: go gofmt
node = "lts"                                       # doctor: node npm
python = "3.13"                                    # doctor: python3.13
ruby = "3.4"                                       # doctor: ruby gem bundle
rust = { version = "stable", profile = "default" } # doctor: rustc cargo rustfmt cargo-clippy

# Developer CLIs: avoid global npm/uv installations.
# Preserve installed versions when transferring ownership from Homebrew.
"aqua:neovim/neovim" = "0.12.6" # doctor: nvim
gitui = "0.28.1"
gh = "2.102.0"
lefthook = "2.2.2"
# The package's postinstall links the platform-specific executable.
"npm:@opencode/cli" = { version = "2.0.32", allow_builds = ["@opencode/cli"] } # doctor: opencode
bottom = "0.14.9" # doctor: btm
eza = "0.23.5"

uv = "latest"                  # doctor: uv uvx
tree-sitter = "0.26.5"
"npm:@openai/codex" = "latest" # doctor: codex
"pipx:pre-commit" = "latest"   # doctor: pre-commit

ripgrep = "latest" # doctor: rg
fd = "latest"
fzf = "latest"
bat = "latest"
zoxide = "latest"

"github:Kampfkarren/selene" = "latest" # doctor: selene
stylua = "latest"
ruff = "latest"
shellcheck = "latest"
golangci-lint = "latest"
